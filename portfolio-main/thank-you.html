<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanks for your submission!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      width: 100%;
    }
    .icon {
      width: 56px;
      height: 56px;
      background: #e6f4ea;
      color: #137333;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #5f6368;
      margin-bottom: 32px;
    }
    a {
      display: inline-block;
      background: #1a1a1a;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 6px;
    }
    a:hover { background: #333; }
    .small {
      margin-top: 28px;
      font-size: 13px;
      color: #9aa0a6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">✓</div>
    <h1>Thanks for your submission!</h1>
    <p>Your form has been submitted successfully.<br>
    We'll get back to you soon.</p>
    <a href="index.html">← Go back to site</a>
    <div class="small">Powered by Formspree</div>
  </div>
</body>
</html>
